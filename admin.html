<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理後台 | 安迪好室</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- Login -->
<section id="loginView" class="admin-login">
  <form id="loginForm" class="admin-login-card">
    <div class="logo logo-brand" style="margin-bottom: 24px;"><img src="images/logo.jpg" alt="安迪好室">安迪<span>好室</span></div>
    <h1>管理後台登入</h1>
    <div class="form-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username">
    </div>
    <div class="form-field">
      <label for="loginPassword">密碼</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">登入</button>
    <p class="form-note" id="loginNote"></p>
  </form>
</section>

<!-- Dashboard -->
<section id="dashboardView" class="admin-dashboard" hidden>
  <header class="admin-header">
    <div class="logo logo-brand"><img src="images/logo.jpg" alt="安迪好室">安迪<span>好室</span> 管理後台</div>
    <div class="admin-header-actions">
      <span id="userEmail" class="admin-user"></span>
      <a href="index.html" class="btn btn-outline" style="padding:8px 20px;">查看網站</a>
      <button id="logoutBtn" class="btn btn-primary" style="padding:8px 20px;">登出</button>
    </div>
  </header>

  <nav class="admin-tabs">
    <button class="admin-tab active" data-tab="properties">房源管理</button>
    <button class="admin-tab" data-tab="leads">聯絡表單</button>
  </nav>

  <!-- Properties Tab -->
  <div class="admin-panel" id="panel-properties">
    <div class="admin-panel-head">
      <h2>房源列表</h2>
      <button class="btn btn-primary" id="addPropertyBtn">＋ 新增房源</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table" id="propertyTable">
        <thead>
          <tr>
            <th>圖片</th><th>標題</th><th>類型</th><th>地區</th><th>價格</th><th>狀態</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="propertyTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Leads Tab -->
  <div class="admin-panel" id="panel-leads" hidden>
    <div class="admin-panel-head">
      <h2>聯絡表單留言</h2>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table" id="leadTable">
        <thead>
          <tr>
            <th>時間</th><th>姓名</th><th>電話</th><th>Email</th><th>類型</th><th>訊息</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="leadTableBody"></tbody>
      </table>
    </div>
  </div>
</section>

<!-- Property Edit Modal -->
<div class="modal" id="propertyFormModal">
  <div class="modal-content" style="max-width:640px; padding: 32px;">
    <button class="modal-close" id="propertyFormClose">&times;</button>
    <h2 id="propertyFormTitle">新增房源</h2>
    <form id="propertyForm" class="admin-form">
      <input type="hidden" id="propId">
      <div class="form-row">
        <div class="form-field">
          <label for="propTitle">標題 *</label>
          <input type="text" id="propTitle" required>
        </div>
        <div class="form-field">
          <label for="propType">類型 *</label>
          <select id="propType" required>
            <option value="住宅">住宅大樓</option>
            <option value="華廈">華廈</option>
            <option value="透天">透天厝</option>
            <option value="套房">套房</option>
          </select>
        </div>
      </div>
      <div class="form-field">
        <label for="propLocation">地址 *</label>
        <input type="text" id="propLocation" required>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="propPrice">價格(萬,數字) *</label>
          <input type="number" id="propPrice" required min="0">
        </div>
        <div class="form-field">
          <label for="propArea">坪數 *</label>
          <input type="number" id="propArea" required min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="propRooms">房數 *</label>
          <input type="number" id="propRooms" required min="0">
        </div>
        <div class="form-field">
          <label for="propBaths">衛浴數 *</label>
          <input type="number" id="propBaths" required min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="propFloor">樓層(例如 8F/11F) *</label>
          <input type="text" id="propFloor" required>
        </div>
        <div class="form-field">
          <label for="propAge">屋齡(年) *</label>
          <input type="number" id="propAge" required min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="propStatus">標籤</label>
          <select id="propStatus">
            <option value="">無</option>
            <option value="熱門">熱門</option>
            <option value="新上架">新上架</option>
          </select>
        </div>
        <div class="form-field">
          <label for="propImg">圖片網址 *</label>
          <input type="text" id="propImg" required placeholder="https://... 或 images/xxx.jpg">
        </div>
      </div>
      <div class="form-field">
        <label for="propDesc">物件描述</label>
        <textarea id="propDesc" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">儲存</button>
      <p class="form-note" id="propertyFormNote"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
